<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aventura del Saber - 2º de Primaria</title>
  <meta name="description" content="Juego interactivo y gamificado para 2º de Primaria con explicaciones, minijuegos y tests según currículo LOMLOE.">
  
  <!-- Configuración PWA (Progressive Web App) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Configuración específica para iPhone y iPad (iOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aventura 2º">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  
  <!-- Motor Tailwind CSS (compatible tanto en local como al subirlo a internet) -->
  <script src="https://cdn.tailwindcss.com" onerror="this.onerror=null;this.src='https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js';"></script>
  
  <!-- Estilos del Juego -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-amber-50 via-sky-50 to-emerald-50 min-h-screen text-slate-800 antialiased flex flex-col justify-between selection:bg-indigo-200">

  <!-- Canvas de Confeti a Pantalla Completa -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Contenedor de Alertas Toast -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

  <!-- Barra Superior de Navegación y Estado del Niño -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b-2 border-slate-200 shadow-sm px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <!-- Logotipo y Nombre del Juego -->
      <div onclick="app.navigateTo('home')" class="flex items-center gap-2.5 cursor-pointer group">
        <span class="text-3xl p-1.5 bg-gradient-to-tr from-amber-400 to-indigo-500 rounded-2xl shadow text-white group-hover:scale-105 transition-transform">🚀</span>
        <div>
          <span class="font-black text-lg md:text-xl text-slate-900 tracking-tight flex items-center gap-1.5">
            Aventura del Saber <span class="text-xs bg-indigo-600 text-white font-extrabold px-2 py-0.5 rounded-full">2º Primaria</span>
          </span>
          <span id="player-level-badge" class="block text-xs font-bold text-indigo-700">Nivel 1 • Novato Curioso 🌱</span>
        </div>
      </div>

      <!-- Estado del Jugador (Monedas, Mascota, Avatar, Sonido, Instalar PWA) -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Botón de Instalar App PWA (se muestra automáticamente si es compatible) -->
        <button id="pwa-install-btn" class="hidden btn-bubble bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-2xl font-black text-xs shadow flex items-center gap-1.5 animate-pulse" title="Instalar en tu Tablet o Móvil">
          <span>📲</span> <span class="hidden md:inline">Instalar App</span>
        </button>

        <!-- Monedas -->
        <div onclick="app.navigateTo('shop')" class="flex items-center gap-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 px-3 py-1.5 rounded-2xl font-black text-sm cursor-pointer transition-all shadow-sm">
          <span>🪙</span>
          <span id="player-coins-display">0</span>
        </div>

        <!-- Mascota activa -->
        <span id="player-pet-display" class="hidden text-2xl animate-wiggle" title="Tu mascota"></span>

        <!-- Botones de Navegación Rápida -->
        <button onclick="app.navigateTo('medals')" class="p-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-base" title="Trofeos y Medallas">
          🏅
        </button>
        <button onclick="app.navigateTo('shop')" class="p-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-base" title="Tienda de Mascotas">
          🛒
        </button>
        <button id="mute-toggle-btn" class="p-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-base" title="Silenciar / Activar Sonido">
          🔊
        </button>

        <!-- Avatar del Niño -->
        <div onclick="app.navigateTo('profile')" class="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 px-2.5 py-1 rounded-2xl cursor-pointer transition-all">
          <span id="player-avatar-display" class="text-2xl">👨‍🚀</span>
          <span id="player-name-display" class="font-extrabold text-xs md:text-sm text-indigo-900 hidden sm:inline max-w-[100px] truncate">
            Super Estudiante
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal Dinámico -->
  <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 lg:p-8">
    <div id="main-app-container">
      <!-- Aquí se renderiza la pantalla activa: home, explicación, minijuego, test, perfil, medallas, etc. -->
    </div>
  </main>

  <!-- Pie de Página Educativo -->
  <footer class="mt-8 border-t border-slate-200 bg-white/70 py-4 text-center text-xs text-slate-500 font-medium">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <span>🎒 Aventura del Saber 2º de Primaria • Currículo Oficial LOMLOE</span>
      <div class="flex gap-4">
        <button onclick="app.navigateTo('home')" class="hover:text-indigo-600 font-bold">Asignaturas</button>
        <button onclick="app.navigateTo('medals')" class="hover:text-indigo-600 font-bold">Medallero</button>
        <button onclick="app.navigateTo('diploma')" class="hover:text-indigo-600 font-bold">Diploma</button>
      </div>
    </div>
  </footer>

  <!-- Scripts del Juego -->
  <script src="data.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>

  <!-- Registro y Gestión de la PWA (Progressive Web App) -->
  <script>
    // Registro del Service Worker para funcionamiento Offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker listo con alcance:', reg.scope))
          .catch((err) => console.warn('PWA Service Worker no pudo registrarse:', err));
      });
    }

    // Gestión del botón de instalación de la PWA
    let deferredPrompt = null;
    const pwaBtn = document.getElementById('pwa-install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevenir el banner por defecto del navegador
      e.preventDefault();
      deferredPrompt = e;
      if (pwaBtn) {
        pwaBtn.classList.remove('hidden');
      }
    });

    if (pwaBtn) {
      pwaBtn.addEventListener('click', async () => {
        if (!deferredPrompt) {
          // Si estamos en iPhone/iPad Safari, explicar cómo instalar
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          if (isIOS) {
            alert('Para instalar en tu iPhone o iPad:\n1. Pulsa el botón "Compartir" de Safari (el cuadrado con la flecha hacia arriba ⬆️).\n2. Selecciona "Añadir a la pantalla de inicio" 📲.');
          } else {
            alert('Puedes instalar esta aplicación desde el menú de opciones de tu navegador pulsando "Instalar aplicación" o "Añadir a pantalla de inicio" 📲.');
          }
          return;
        }
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Resultado de instalación:', outcome);
        deferredPrompt = null;
        pwaBtn.classList.add('hidden');
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('¡PWA instalada con éxito!');
      if (pwaBtn) pwaBtn.classList.add('hidden');
    });
  </script>
</body>
</html>
